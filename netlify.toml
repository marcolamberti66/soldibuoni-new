[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Recensioni affiliate dismesse → guide corrispondenti
[[redirects]]
  from = "/recensione-eni"
  to = "/guida/bolletta-luce"
  status = 301
[[redirects]]
  from = "/recensione-windtre"
  to = "/internet"
  status = 301
[[redirects]]
  from = "/recensione-lyca"
  to = "/internet"
  status = 301
[[redirects]]
  from = "/recensione-bbva"
  to = "/conti-correnti"
  status = 301
[[redirects]]
  from = "/recensione-hype"
  to = "/conti-correnti"
  status = 301
[[redirects]]
  from = "/analisi-bolletta"
  to = "/casa"
  status = 301

[functions]
  node_bundler = "esbuild"

# URL storici senza più una pagina → contenuto più vicino
[[redirects]]
  from = "/energia"
  to = "/guida/bolletta-luce"
  status = 301
[[redirects]]
  from = "/gas"
  to = "/guida/bolletta-gas"
  status = 301
[[redirects]]
  from = "/acqua"
  to = "/guida/costi-casa"
  status = 301
[[redirects]]
  from = "/carburante"
  to = "/strumenti"
  status = 301
[[redirects]]
  from = "/newsletter"
  to = "/casa"
  status = 301
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# App installabile: il service worker non va mai messo in cache dal browser
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# "Condividi con SoldiBuoni" quando il service worker non è ancora attivo
[[redirects]]
  from = "/casa-condividi"
  to = "/casa"
  status = 302
  force = true
